---
- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer Nginx
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present

- name: Créer le répertoire du site
  ansible.builtin.file:
    path: "{{ nginx_document_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Déployer les fichiers du site
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../site/"
    dest: "{{ nginx_document_root }}/"
    owner: root
    group: root
    mode: preserve
  notify: Vérifier et recharger Nginx

- name: Configurer le serveur virtuel Nginx
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
  notify: Vérifier et recharger Nginx

- name: Démarrer Nginx si nécessaire
  ansible.builtin.command: nginx
  args:
    creates: /run/nginx.pid
