services:
  serveur-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: serveur-web
    environment:
      ANSIBLE_PUBLIC_KEY: "${ANSIBLE_PUBLIC_KEY:?Set ANSIBLE_PUBLIC_KEY to the public key used by Ansible}"
    ports:
      - "${ANSIBLE_SSH_PORT:-2222}:22"
      - "8082:80"
    restart: unless-stopped
